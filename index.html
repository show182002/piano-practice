<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>鋼琴練習 · Piano Practice v0.00100</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <h1>鋼琴練習 <span class="ver">v0.00100</span></h1>
    <p class="hint">撳螢幕琴鍵，或接上 MIDI keyboard（例如 Arturia MiniLab 3）。撳五度圈揀調，鍵盤會亮起相關音符。</p>
  </header>

  <section class="panel">
    <div class="row">
      <button type="button" id="btn-audio" class="btn primary">開聲</button>
      <button type="button" id="btn-midi" class="btn">連接 MIDI</button>
      <span id="midi-status" class="status">MIDI：未連接</span>
    </div>
    <div class="row small">
      <label>八度偏移
        <select id="octave-offset">
          <option value="-1">−1</option>
          <option value="0" selected>0</option>
          <option value="1">+1</option>
        </select>
      </label>
      <label>音量
        <input id="volume" type="range" min="0" max="100" value="70" />
      </label>
    </div>
  </section>

  <section class="keyboard-wrap">
    <div id="keyboard" class="keyboard" aria-label="虛擬鋼琴"></div>
  </section>

  <section class="cof-section panel">
    <h2 class="cof-heading">五度圈</h2>
    <p class="cof-hint">撳外圈大調；內圈細字係相對小調。再撳音階／和弦，鍵盤會亮起對應鍵。</p>
    <div id="circle-of-fifths"></div>
  </section>

  <footer class="foot">
    <p>v0.00100：虛擬鍵盤 + Web Audio + Web MIDI + 五度圈（模組化）。之後可加轉調、練習模式。</p>
  </footer>

  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/circleOfFifths.js"></script>
  <script>
    CircleOfFifths.mount(document.getElementById("circle-of-fifths"));
  </script>
</body>
</html>
