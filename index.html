<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6b53e8f0-d9e3-4a32-b934-f559d65777d6
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>鋼琴練習 · Piano Practice v0.00300</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <h1>鋼琴練習 <span class="ver">v0.00300</span></h1>
    <p class="hint">撳「開聲」之後，可以喺「跟彈」跟住和弦練習，或者去「五度圈」揀調。亦可以撳螢幕琴鍵或接 MIDI keyboard。</p>
  </header>

  <section class="panel">
    <div class="row">
      <button type="button" id="btn-audio" class="btn primary">開聲</button>
      <button type="button" id="btn-midi" class="btn">連接 MIDI</button>
      <span id="midi-status" class="status">MIDI：未連接</span>
    </div>
    <div class="row small">
      <label>八度偏移
        <select id="octave-offset">
          <option value="-1">−1</option>
          <option value="0" selected>0</option>
          <option value="1">+1</option>
        </select>
      </label>
      <label>音量
        <input id="volume" type="range" min="0" max="100" value="70" />
      </label>
    </div>
  </section>

  <div class="tabs-wrap">
    <div class="tabs" role="tablist" aria-label="練習模式">
      <button type="button" class="tab on" role="tab" id="tab-follow" aria-controls="panel-follow" aria-selected="true">跟彈</button>
      <button type="button" class="tab" role="tab" id="tab-cof" aria-controls="panel-cof" aria-selected="false">五度圈</button>
    </div>
  </div>

  <section id="panel-follow" class="mode-panel panel" role="tabpanel" aria-labelledby="tab-follow">
    <div id="follow-along"></div>
  </section>

  <section id="panel-cof" class="mode-panel panel cof-section" role="tabpanel" aria-labelledby="tab-cof" hidden>
    <h2 class="cof-heading">五度圈</h2>
    <p class="cof-hint">撳外圈大調；內圈細字係相對小調。再撳音階／和弦，鍵盤會亮起對應鍵。</p>
    <div id="circle-of-fifths"></div>
  </section>

  <section class="keyboard-wrap">
    <div id="keyboard" class="keyboard" aria-label="虛擬鋼琴"></div>
  </section>

  <footer class="foot">
    <p>v0.00300：跟彈《單車》（G 大調）＋歌詞／timeline＋五度圈＋虛擬鍵盤／MIDI。和弦進行係練習用編曲，並非官方譜。</p>
  </footer>

  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/circleOfFifths.js"></script>
  <script src="js/songs/danche.js"></script>
  <script src="js/followAlong.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
