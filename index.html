<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6b53e8f0-d9e3-4a32-b934-f559d65777d6
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>鋼琴練習 · Piano Practice v0.01400</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-view="home">
  <section id="view-home" class="view view-home">
    <header class="top">
      <h1>鋼琴練習 <span class="ver">v0.01400</span></h1>
      <p class="hint">揀一首歌入去練習。練習頁上面係譜（旋律在高音譜、和弦在低音譜），中間同步歌詞，下面係跟 MiniLab 3 嘅鍵盤。亦可以先開五度圈睇調。</p>
    </header>

    <section class="panel home-connect">
      <div class="row">
        <button type="button" class="btn primary btn-audio">開聲</button>
        <button type="button" class="btn btn-midi">連接 MIDI</button>
        <span class="midi-status status">MIDI：未連接</span>
      </div>
    </section>

    <section class="song-grid">
      <article class="song-card">
        <div class="song-card-key">G 大調</div>
        <h2>單車</h2>
        <p class="song-card-artist">陳奕迅</p>
        <p class="song-card-meta">練習用編曲（非官方譜）· 跟 C_Zhukov 簡易鋼琴譜第 1 頁</p>
        <button type="button" class="btn primary" data-open-practice>開始練習</button>
      </article>
    </section>

    <div class="home-tools">
      <button type="button" class="btn" data-open-cof>五度圈</button>
    </div>

    <footer class="foot">
      <p>v0.01400：練習頁譜在上、歌詞在鍵盤上面、鍵盤闊度鎖死。和弦進行同旋律係練習用編曲，並非官方譜。官方歌詞不會預載於公開網站。</p>
    </footer>
  </section>

  <section id="view-practice" class="view view-practice" hidden>
    <div class="practice-stage">
      <div class="practice-chrome">
        <button type="button" class="btn" data-open-home>返回</button>
        <button type="button" class="btn primary btn-audio">開聲</button>
        <button type="button" class="btn btn-midi">連接 MIDI</button>
        <span class="midi-status status">MIDI：未連接</span>
        <button type="button" class="btn primary" id="fa-play">播放</button>
        <button type="button" class="btn" id="fa-pause">暫停</button>
        <button type="button" class="btn" id="fa-stop">停止</button>
        <label class="chrome-label">Level
          <select id="fa-level"></select>
        </label>
        <label class="chrome-label">BPM
          <input id="fa-bpm" type="range" min="40" max="120" value="68" />
          <span id="fa-bpm-val">68</span>
        </label>
        <label class="chrome-label"><input type="checkbox" id="fa-metro" checked />拍子機</label>
        <label class="chrome-label">八度
          <select class="octave-offset">
            <option value="-1">−1</option>
            <option value="0" selected>0</option>
            <option value="1">+1</option>
          </select>
        </label>
        <label class="chrome-label">音量
          <input class="volume" type="range" min="0" max="100" value="70" />
        </label>
        <div class="fa-score-box">
          <span class="k">分數</span>
          <span class="v" id="fa-score">0</span>
        </div>
      </div>

      <div class="fa-transport">
        <div class="fa-timeline">
          <span class="fa-time" id="fa-time-now">0:00</span>
          <div class="fa-timeline-track" id="fa-timeline-track" role="progressbar" aria-label="播放進度">
            <div class="fa-timeline-fill" id="fa-timeline-fill"></div>
            <div class="fa-timeline-playhead" id="fa-timeline-playhead"></div>
          </div>
          <span class="fa-time" id="fa-time-total">0:00</span>
        </div>
        <p class="fa-status" id="fa-status"></p>
      </div>

      <div class="fa-staff-panel">
        <div class="fa-staff-toolbar">
          <span class="fa-staff-title" id="fa-staff-title">單車</span>
          <span class="fa-staff-pos" id="fa-beats"></span>
          <label class="chrome-label fa-bars-label">顯示
            <select id="fa-bars">
              <option value="2">2 節</option>
              <option value="3">3 節</option>
              <option value="4" selected>4 節</option>
              <option value="5">5 節</option>
              <option value="6">6 節</option>
            </select>
          </label>
        </div>
        <div id="fa-staff" class="fa-staff" aria-label="大譜表"></div>
      </div>

      <div class="fa-lyrics" aria-live="polite">
        <div class="fa-lyric-current empty" id="fa-lyric-current"></div>
        <div class="fa-lyric-next" id="fa-lyric-next"></div>
      </div>

      <div class="keyboard-wrap practice-keys" id="keyboard-dock-practice">
        <div id="keyboard" class="keyboard" aria-label="虛擬鋼琴"></div>
      </div>
    </div>
  </section>

  <section id="view-cof" class="view view-cof" hidden>
    <header class="top">
      <button type="button" class="btn" data-open-home>返回曲目</button>
      <h1>五度圈</h1>
      <p class="hint">撳外圈大調；內圈細字係相對小調。再撳音階／和弦，鍵盤會亮起對應鍵。</p>
    </header>
    <section class="panel">
      <div class="row">
        <button type="button" class="btn primary btn-audio">開聲</button>
        <button type="button" class="btn btn-midi">連接 MIDI</button>
        <span class="midi-status status">MIDI：未連接</span>
      </div>
    </section>
    <section class="panel cof-section">
      <div id="circle-of-fifths"></div>
    </section>
    <div class="keyboard-wrap cof-keys" id="keyboard-dock-cof"></div>
  </section>

  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/circleOfFifths.js"></script>
  <script src="js/songs/danche.js"></script>
  <script src="js/followAlong.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
